version: '3.8'

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
  monitoring-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  nginx_logs:
    driver: local

services:
  # 1. Database: PostgreSQL (Isolated in backend-network)
  fleet-postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleetdb
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: FleetSecret2026!Secure
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-network
      - monitoring-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_user -d fleetdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. pgAdmin (Database GUI management)
  fleet-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fleet-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fleet.com
      PGADMIN_DEFAULT_PASSWORD: FleetAdmin2026!Secure
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend-network
      - frontend-network
    depends_on:
      - fleet-postgres

  # 3. Web App: Node.js / Express
  fleet-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: fleet-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: fleet-postgres
      DB_PORT: 5432
      DB_NAME: fleetdb
      DB_USER: fleet_user
      DB_PASSWORD: FleetSecret2026!Secure
    networks:
      - frontend-network
      - backend-network
      - monitoring-network
    depends_on:
      fleet-postgres:
        condition: service_healthy

  # 4. Reverse Proxy: Nginx (HTTPS & Security Headers)
  fleet-nginx:
    image: nginx:alpine
    container_name: fleet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend-network
      - monitoring-network
    depends_on:
      - fleet-app
      - fleet-pgadmin

  # 5. Prometheus
  fleet-prometheus:
    image: prom/prometheus:v2.51.0
    container_name: fleet-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring-network

  # 6. Grafana
  fleet-grafana:
    image: grafana/grafana:10.4.0
    container_name: fleet-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-network
    depends_on:
      - fleet-prometheus
      - fleet-loki

  # 7. cAdvisor (Container monitoring)
  fleet-cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: fleet-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-network

  # 8. PostgreSQL Exporter
  fleet-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fleet-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://fleet_user:FleetSecret2026!Secure@fleet-postgres:5432/fleetdb?sslmode=disable"
    networks:
      - monitoring-network
      - backend-network
    depends_on:
      fleet-postgres:
        condition: service_healthy

  # 9. Nginx Exporter
  fleet-nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: fleet-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://fleet-nginx:80/stub_status
    networks:
      - monitoring-network
      - frontend-network
    depends_on:
      - fleet-nginx

  # 10. Loki (Log aggregation)
  fleet-loki:
    image: grafana/loki:3.0.0
    container_name: fleet-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-network

  # 11. Promtail (Log shipping)
  fleet-promtail:
    image: grafana/promtail:3.0.0
    container_name: fleet-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring-network
    depends_on:
      - fleet-loki
