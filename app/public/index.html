<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚛 Quản Lý Đội Xe - Fleet Management System</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚛</text></svg>">
  <style>
    :root {
      --primary: #1e40af; --primary-dark: #1e3a8a; --primary-light: #3b82f6;
      --success: #059669; --warning: #d97706; --danger: #dc2626; --info: #0891b2;
      --bg: #f0f4f8; --surface: #ffffff; --text: #1e293b; --text-secondary: #64748b;
      --border: #e2e8f0; --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* HEADER */
    .header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; padding: 0 2rem; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-md); }
    .header-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: .5rem; }
    .header-time { font-size: .9rem; opacity: .85; }

    /* TABS */
    .tabs { display: flex; gap: 4px; padding: .5rem 2rem; background: var(--primary-dark); justify-content: center; }
    .tab-btn { padding: .6rem 1.4rem; border: none; background: transparent; color: rgba(255,255,255,.7); font-size: .95rem; font-weight: 600; cursor: pointer; border-radius: 8px 8px 0 0; transition: all .2s; }
    .tab-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
    .tab-btn.active { background: var(--bg); color: var(--primary); }

    /* MAIN LAYOUT */
    .main { max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }

    /* STATS CARDS */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: var(--surface); border-radius: var(--radius); padding: 1.2rem 1.5rem; box-shadow: var(--shadow); display: flex; align-items: center; gap: 1rem; }
    .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
    .stat-icon.vehicle { background: #dbeafe; } .stat-icon.driver { background: #dcfce7; }
    .stat-icon.schedule { background: #fef3c7; } .stat-icon.maintenance { background: #fce7f3; }
    .stat-info h3 { font-size: 1.6rem; font-weight: 800; line-height: 1; }
    .stat-info p { font-size: .82rem; color: var(--text-secondary); margin-top: 2px; }

    /* SECTION */
    .section { display: none; }
    .section.active { display: block; }

    /* TABLE PANEL */
    .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .panel-header { padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .panel-header h2 { font-size: 1.15rem; }

    table { width: 100%; border-collapse: collapse; }
    th { background: #f8fafc; text-align: left; padding: .75rem 1rem; font-size: .8rem; text-transform: uppercase; color: var(--text-secondary); letter-spacing: .5px; font-weight: 600; white-space: nowrap; }
    td { padding: .75rem 1rem; border-top: 1px solid var(--border); font-size: .9rem; }
    tr:hover { background: #f1f5f9; }

    .badge { padding: 3px 10px; border-radius: 20px; font-size: .78rem; font-weight: 600; display: inline-block; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    .badge-info { background: #dbeafe; color: #1e40af; }
    .badge-purple { background: #f3e8ff; color: #6b21a8; }

    /* BUTTONS */
    .btn { padding: .55rem 1.2rem; border: none; border-radius: 8px; font-size: .88rem; font-weight: 600; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: .4rem; }
    .btn-primary { background: var(--primary); color: #fff; } .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger { background: #fee2e2; color: var(--danger); } .btn-danger:hover { background: #fecaca; }
    .btn-sm { padding: .35rem .7rem; font-size: .8rem; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 200; justify-content: center; align-items: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--surface); border-radius: var(--radius); padding: 2rem; width: 95%; max-width: 540px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,.2); }
    .modal h3 { margin-bottom: 1.2rem; font-size: 1.2rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: .3rem; font-weight: 600; font-size: .88rem; color: var(--text-secondary); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: .6rem .8rem; border: 1.5px solid var(--border); border-radius: 8px; font-size: .92rem; transition: border .15s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .form-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1.5rem; }

    /* RESPONSIVE TABLE */
    .table-wrap { overflow-x: auto; }

    /* Empty state */
    .empty { text-align: center; padding: 3rem; color: var(--text-secondary); }
    .empty-icon { font-size: 3rem; margin-bottom: .5rem; }

    @media (max-width: 768px) {
      .header-inner { padding: 0 .5rem; } .tabs { padding: .5rem; flex-wrap: wrap; }
      .main { padding: 1rem; } .stats { grid-template-columns: 1fr 1fr; }
      .tab-btn { padding: .4rem .8rem; font-size: .82rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <div class="logo">🚛 Fleet Manager</div>
      <div class="header-time" id="headerTime"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard">📊 Tổng quan</button>
    <button class="tab-btn" data-tab="vehicles">🚗 Xe</button>
    <button class="tab-btn" data-tab="drivers">👨‍✈️ Tài xế</button>
    <button class="tab-btn" data-tab="schedules">📅 Lịch trình</button>
    <button class="tab-btn" data-tab="maintenances">🔧 Bảo dưỡng</button>
  </div>

  <div class="main">
    <!-- Dashboard -->
    <div class="section active" id="sec-dashboard">
      <div class="stats" id="statsCards"></div>
      <div class="panel">
        <div class="panel-header"><h2>📋 Lịch Trình Gần Đây</h2></div>
        <div class="table-wrap" id="recentSchedules"></div>
      </div>
    </div>

    <!-- Vehicles -->
    <div class="section" id="sec-vehicles">
      <div class="panel">
        <div class="panel-header">
          <h2>🚗 Danh Sách Xe</h2>
          <button class="btn btn-primary" onclick="openModal('vehicle')">+ Thêm xe</button>
        </div>
        <div class="table-wrap" id="vehiclesTable"></div>
      </div>
    </div>

    <!-- Drivers -->
    <div class="section" id="sec-drivers">
      <div class="panel">
        <div class="panel-header">
          <h2>👨‍✈️ Danh Sách Tài Xế</h2>
          <button class="btn btn-primary" onclick="openModal('driver')">+ Thêm tài xế</button>
        </div>
        <div class="table-wrap" id="driversTable"></div>
      </div>
    </div>

    <!-- Schedules -->
    <div class="section" id="sec-schedules">
      <div class="panel">
        <div class="panel-header">
          <h2>📅 Lịch Trình / Chuyến Xe</h2>
          <button class="btn btn-primary" onclick="openModal('schedule')">+ Thêm lịch trình</button>
        </div>
        <div class="table-wrap" id="schedulesTable"></div>
      </div>
    </div>

    <!-- Maintenances -->
    <div class="section" id="sec-maintenances">
      <div class="panel">
        <div class="panel-header">
          <h2>🔧 Lịch Sử Bảo Dưỡng</h2>
          <button class="btn btn-primary" onclick="openModal('maintenance')">+ Thêm bảo dưỡng</button>
        </div>
        <div class="table-wrap" id="maintenancesTable"></div>
      </div>
    </div>
  </div>

  <!-- MODALS -->
  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalContent"></div>
  </div>

  <script>
    // === Tab Navigation ===
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('sec-' + btn.dataset.tab).classList.add('active');
        loadData();
      });
    });

    // === Clock ===
    function updateClock() {
      const now = new Date();
      document.getElementById('headerTime').textContent = now.toLocaleString('vi-VN', { dateStyle: 'full', timeStyle: 'medium' });
    }
    setInterval(updateClock, 1000); updateClock();

    // === Status Badge Helper ===
    function badge(status) {
      const map = {
        'Sẵn sàng': 'badge-success', 'Đang chạy chuyến': 'badge-info', 'Đang di chuyển': 'badge-info',
        'Đang bảo dưỡng': 'badge-warning', 'Đang thực hiện': 'badge-warning', 'Nghỉ phép': 'badge-danger',
        'Hoàn thành': 'badge-success', 'Đã xếp lịch': 'badge-purple', 'Đã hủy': 'badge-danger'
      };
      return `<span class="badge ${map[status] || 'badge-info'}">${status}</span>`;
    }

    function formatNumber(n) { return Number(n || 0).toLocaleString('vi-VN'); }
    function formatDate(d) { return d ? new Date(d).toLocaleDateString('vi-VN') : '—'; }
    function formatDateTime(d) { return d ? new Date(d).toLocaleString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—'; }
    function formatMoney(n) { return Number(n || 0).toLocaleString('vi-VN') + ' ₫'; }

    // === Load data ===
    let vehiclesData = [], driversData = [];
    async function loadData() {
      try {
        const [statsRes, vehiclesRes, driversRes, schedulesRes, maintenancesRes] = await Promise.all([
          fetch('/api/stats'), fetch('/api/vehicles'), fetch('/api/drivers'),
          fetch('/api/schedules'), fetch('/api/maintenances')
        ]);
        const stats = await statsRes.json();
        vehiclesData = await vehiclesRes.json();
        driversData = await driversRes.json();
        const schedules = await schedulesRes.json();
        const maintenances = await maintenancesRes.json();

        renderStats(stats);
        renderVehicles(vehiclesData);
        renderDrivers(driversData);
        renderSchedules(schedules);
        renderMaintenances(maintenances);
        renderRecentSchedules(schedules.slice(0, 5));
      } catch(e) { console.error('Error loading data:', e); }
    }

    function renderStats(s) {
      document.getElementById('statsCards').innerHTML = `
        <div class="stat-card"><div class="stat-icon vehicle">🚗</div><div class="stat-info"><h3>${s.vehicles.total}</h3><p>Tổng xe • ${s.vehicles.available} sẵn sàng</p></div></div>
        <div class="stat-card"><div class="stat-icon driver">👨‍✈️</div><div class="stat-info"><h3>${s.drivers.total}</h3><p>Tài xế • ${s.drivers.available} sẵn sàng</p></div></div>
        <div class="stat-card"><div class="stat-icon schedule">📅</div><div class="stat-info"><h3>${s.schedules.total}</h3><p>Lịch trình • ${s.schedules.active} đang chạy</p></div></div>
        <div class="stat-card"><div class="stat-icon maintenance">🔧</div><div class="stat-info"><h3>${s.maintenances.total}</h3><p>Bảo dưỡng • ${formatMoney(s.maintenances.total_cost)}</p></div></div>
      `;
    }

    function renderRecentSchedules(data) {
      if (!data.length) { document.getElementById('recentSchedules').innerHTML = '<div class="empty"><div class="empty-icon">📅</div>Chưa có lịch trình nào</div>'; return; }
      document.getElementById('recentSchedules').innerHTML = `<table><thead><tr><th>Xe</th><th>Tài xế</th><th>Lộ trình</th><th>Khởi hành</th><th>Trạng thái</th></tr></thead><tbody>${
        data.map(s => `<tr><td>${s.plate_number || '—'} <small style="color:#64748b">${s.model || ''}</small></td><td>${s.driver_name || '—'}</td><td>${s.departure} → ${s.destination}</td><td>${formatDateTime(s.departure_time)}</td><td>${badge(s.status)}</td></tr>`).join('')
      }</tbody></table>`;
    }

    function renderVehicles(data) {
      if (!data.length) { document.getElementById('vehiclesTable').innerHTML = '<div class="empty"><div class="empty-icon">🚗</div>Chưa có xe nào</div>'; return; }
      document.getElementById('vehiclesTable').innerHTML = `<table><thead><tr><th>Biển số</th><th>Model</th><th>Loại xe</th><th>Tải trọng</th><th>ODO</th><th>Trạng thái</th><th></th></tr></thead><tbody>${
        data.map(v => `<tr><td><strong>${v.plate_number}</strong></td><td>${v.model}</td><td>${v.vehicle_type}</td><td>${v.load_capacity} tấn</td><td>${formatNumber(v.current_odometer)} km</td><td>${badge(v.status)}</td><td><button class="btn btn-danger btn-sm" onclick="deleteItem('vehicles',${v.id})">Xóa</button></td></tr>`).join('')
      }</tbody></table>`;
    }

    function renderDrivers(data) {
      if (!data.length) { document.getElementById('driversTable').innerHTML = '<div class="empty"><div class="empty-icon">👨‍✈️</div>Chưa có tài xế nào</div>'; return; }
      document.getElementById('driversTable').innerHTML = `<table><thead><tr><th>Họ tên</th><th>Bằng lái</th><th>SĐT</th><th>Kinh nghiệm</th><th>Trạng thái</th><th></th></tr></thead><tbody>${
        data.map(d => `<tr><td><strong>${d.full_name}</strong></td><td>${d.license_number}</td><td>${d.phone}</td><td>${d.experience_years} năm</td><td>${badge(d.status)}</td><td><button class="btn btn-danger btn-sm" onclick="deleteItem('drivers',${d.id})">Xóa</button></td></tr>`).join('')
      }</tbody></table>`;
    }

    function renderSchedules(data) {
      if (!data.length) { document.getElementById('schedulesTable').innerHTML = '<div class="empty"><div class="empty-icon">📅</div>Chưa có lịch trình nào</div>'; return; }
      document.getElementById('schedulesTable').innerHTML = `<table><thead><tr><th>Xe</th><th>Tài xế</th><th>Điểm đi</th><th>Điểm đến</th><th>Khởi hành</th><th>Dự kiến đến</th><th>Hàng hóa</th><th>Trạng thái</th><th></th></tr></thead><tbody>${
        data.map(s => `<tr><td>${s.plate_number || '—'}</td><td>${s.driver_name || '—'}</td><td>${s.departure}</td><td>${s.destination}</td><td>${formatDateTime(s.departure_time)}</td><td>${formatDateTime(s.estimated_arrival)}</td><td>${s.cargo_weight} tấn</td><td>${badge(s.status)}</td><td><button class="btn btn-danger btn-sm" onclick="deleteItem('schedules',${s.id})">Xóa</button></td></tr>`).join('')
      }</tbody></table>`;
    }

    function renderMaintenances(data) {
      if (!data.length) { document.getElementById('maintenancesTable').innerHTML = '<div class="empty"><div class="empty-icon">🔧</div>Chưa có bảo dưỡng nào</div>'; return; }
      document.getElementById('maintenancesTable').innerHTML = `<table><thead><tr><th>Xe</th><th>Ngày</th><th>Mô tả</th><th>Chi phí</th><th>Nơi bảo dưỡng</th><th>Trạng thái</th><th></th></tr></thead><tbody>${
        data.map(m => `<tr><td>${m.plate_number || '—'} <small style="color:#64748b">${m.model || ''}</small></td><td>${formatDate(m.maintenance_date)}</td><td style="max-width:250px">${m.description}</td><td style="white-space:nowrap"><strong>${formatMoney(m.cost)}</strong></td><td>${m.service_provider || '—'}</td><td>${badge(m.status)}</td><td><button class="btn btn-danger btn-sm" onclick="deleteItem('maintenances',${m.id})">Xóa</button></td></tr>`).join('')
      }</tbody></table>`;
    }

    // === Modal ===
    function openModal(type) {
      const el = document.getElementById('modalContent');
      const vehicleOpts = vehiclesData.map(v => `<option value="${v.id}">${v.plate_number} - ${v.model}</option>`).join('');
      const driverOpts = driversData.map(d => `<option value="${d.id}">${d.full_name} (${d.license_number})</option>`).join('');

      const forms = {
        vehicle: `<h3>🚗 Thêm Xe Mới</h3>
          <form onsubmit="return submitForm(event,'vehicles')">
            <div class="form-group"><label>Biển số xe *</label><input name="plate_number" required placeholder="VD: 29H-123.45"></div>
            <div class="form-group"><label>Model *</label><input name="model" required placeholder="VD: Hyundai HD120"></div>
            <div class="form-group"><label>Loại xe *</label><input name="vehicle_type" required placeholder="VD: Xe tải thùng 8 tấn"></div>
            <div class="form-group"><label>Tải trọng (tấn)</label><input name="load_capacity" type="number" step="0.1" placeholder="0"></div>
            <div class="form-group"><label>ODO (km)</label><input name="current_odometer" type="number" placeholder="0"></div>
            <div class="form-group"><label>Trạng thái</label><select name="status"><option>Sẵn sàng</option><option>Đang chạy chuyến</option><option>Đang bảo dưỡng</option></select></div>
            <div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button type="submit" class="btn btn-primary">Lưu</button></div>
          </form>`,
        driver: `<h3>👨‍✈️ Thêm Tài Xế Mới</h3>
          <form onsubmit="return submitForm(event,'drivers')">
            <div class="form-group"><label>Họ tên *</label><input name="full_name" required></div>
            <div class="form-group"><label>Số bằng lái *</label><input name="license_number" required></div>
            <div class="form-group"><label>SĐT *</label><input name="phone" required></div>
            <div class="form-group"><label>Kinh nghiệm (năm)</label><input name="experience_years" type="number" value="1"></div>
            <div class="form-group"><label>Trạng thái</label><select name="status"><option>Sẵn sàng</option><option>Đang chạy chuyến</option><option>Nghỉ phép</option></select></div>
            <div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button type="submit" class="btn btn-primary">Lưu</button></div>
          </form>`,
        schedule: `<h3>📅 Thêm Lịch Trình Mới</h3>
          <form onsubmit="return submitForm(event,'schedules')">
            <div class="form-group"><label>Xe *</label><select name="vehicle_id" required>${vehicleOpts}</select></div>
            <div class="form-group"><label>Tài xế *</label><select name="driver_id" required>${driverOpts}</select></div>
            <div class="form-group"><label>Điểm đi *</label><input name="departure" required></div>
            <div class="form-group"><label>Điểm đến *</label><input name="destination" required></div>
            <div class="form-group"><label>Thời gian khởi hành *</label><input name="departure_time" type="datetime-local" required></div>
            <div class="form-group"><label>Dự kiến đến</label><input name="estimated_arrival" type="datetime-local"></div>
            <div class="form-group"><label>Trọng lượng hàng (tấn)</label><input name="cargo_weight" type="number" step="0.1"></div>
            <div class="form-group"><label>Trạng thái</label><select name="status"><option>Đã xếp lịch</option><option>Đang di chuyển</option><option>Hoàn thành</option><option>Đã hủy</option></select></div>
            <div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button type="submit" class="btn btn-primary">Lưu</button></div>
          </form>`,
        maintenance: `<h3>🔧 Thêm Bảo Dưỡng</h3>
          <form onsubmit="return submitForm(event,'maintenances')">
            <div class="form-group"><label>Xe *</label><select name="vehicle_id" required>${vehicleOpts}</select></div>
            <div class="form-group"><label>Ngày bảo dưỡng *</label><input name="maintenance_date" type="date" required></div>
            <div class="form-group"><label>Mô tả công việc *</label><textarea name="description" required rows="3"></textarea></div>
            <div class="form-group"><label>Chi phí (VNĐ)</label><input name="cost" type="number" placeholder="0"></div>
            <div class="form-group"><label>Nơi bảo dưỡng</label><input name="service_provider"></div>
            <div class="form-group"><label>Trạng thái</label><select name="status"><option>Hoàn thành</option><option>Đang thực hiện</option></select></div>
            <div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button type="submit" class="btn btn-primary">Lưu</button></div>
          </form>`
      };
      el.innerHTML = forms[type];
      document.getElementById('modalOverlay').classList.add('show');
    }

    function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

    async function submitForm(e, endpoint) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = Object.fromEntries(fd.entries());
      try {
        const res = await fetch('/api/' + endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!res.ok) { const err = await res.json(); alert('Lỗi: ' + err.error); return false; }
        closeModal(); loadData();
      } catch(err) { alert('Lỗi kết nối!'); }
      return false;
    }

    async function deleteItem(endpoint, id) {
      if (!confirm('Bạn có chắc muốn xóa mục này?')) return;
      await fetch(`/api/${endpoint}/${id}`, { method: 'DELETE' });
      loadData();
    }

    // Initial load
    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
