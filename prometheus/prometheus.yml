global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'fleet-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fleet-backend:8000']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['fleet-cadvisor:8080']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['fleet-postgres-exporter:9187']

  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['fleet-nginx-exporter:9113']
